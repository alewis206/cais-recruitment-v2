name: Weekly Refresh

on:
  # Mondays 06:00 PT = 13:00 UTC (PDT) / 14:00 UTC (PST). 13:00 covers most of
  # the year; if you want strict 06:00 PT year-round, switch to a workflow
  # dispatch that pins the local time.
  schedule:
    - cron: "0 13 * * 1"
  # Allow manual runs from the GitHub UI.
  workflow_dispatch:
    inputs:
      skip_email:
        description: "Skip the digest email (dry run)"
        required: false
        default: "false"
      skip_llm:
        description: "Use rule-based scoring only (no Anthropic API call)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run weekly refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX: ${{ vars.AGENTMAIL_INBOX }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
            ARGS="$ARGS --no-email"
          fi
          if [ "${{ github.event.inputs.skip_llm }}" = "true" ]; then
            ARGS="$ARGS --no-llm"
          fi
          npx tsx scripts/refresh.ts $ARGS

      - name: Commit updated events.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          if git diff --quiet -- data/events.json; then
            echo "No changes to events.json; skipping commit."
            exit 0
          fi
          git add data/events.json
          git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: data/events.json
          if-no-files-found: ignore
          retention-days: 90
